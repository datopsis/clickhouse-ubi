name: Release image

on:
  push:
    tags:
      - "v*"

permissions: read-all

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/datopsis/clickhouse-ubi

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write
      packages: write
      security-events: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag and changelog
        run: bash scripts/validate-release-tag.sh "${GITHUB_REF_NAME}" --require-annotated

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=sha,prefix=sha-

      - name: Build and publish multi-architecture image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Verify published manifest architectures
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -Eeuo pipefail
          docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}" |
            jq -e '
              ([.manifests[].platform | select(.os == "linux" and .architecture == "amd64")] | length >= 1)
              and ([.manifests[].platform | select(.os == "linux" and .architecture == "arm64")] | length >= 1)
            '

  scan:
    name: release scan (${{ matrix.architecture }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
            machine: x86_64
          - architecture: arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      security-events: write
    env:
      TEST_IMAGE: ghcr.io/datopsis/clickhouse-ubi@${{ needs.build.outputs.digest }}
      SBOM_FILE: clickhouse-ubi-${{ matrix.architecture }}.spdx.json
      TRIVY_ALL: trivy-all-${{ matrix.architecture }}.json
      GRYPE_SARIF: grype-${{ matrix.architecture }}.sarif
      GRYPE_ALL: grype-all-${{ matrix.architecture }}.json
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Confirm native runner architecture
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: test "$(uname -m)" = "${EXPECTED_MACHINE}"

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull native release image
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          docker pull "${TEST_IMAGE}"
          test "$(docker image inspect --format '{{.Architecture}}' "${TEST_IMAGE}")" = "${EXPECTED_ARCHITECTURE}"

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.TEST_IMAGE }}
          format: json
          output: ${{ env.TRIVY_ALL }}
          exit-code: "0"
          ignore-unfixed: false
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          scanners: vuln,secret

      - name: Generate SPDX SBOM with Syft
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.TEST_IMAGE }}
          format: spdx-json
          output-file: ${{ env.SBOM_FILE }}
          syft-version: v1.51.1
          upload-artifact: false
          upload-release-assets: false

      - name: Add declared ClickHouse TGZ components to SPDX SBOM
        run: >-
          python scripts/augment-spdx.py
          --input "${SBOM_FILE}"
          --output "${SBOM_FILE}"

      - name: Scan Syft SBOM with Grype
        id: grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: ${{ env.SBOM_FILE }}
          output-format: sarif
          output-file: ${{ env.GRYPE_SARIF }}
          severity-cutoff: high
          only-fixed: true
          fail-build: false
          cache-db: true
          grype-version: v0.118.0

      - name: Record all Grype findings
        if: ${{ always() && hashFiles(env.SBOM_FILE) != '' }}
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: ${{ env.SBOM_FILE }}
          output-format: json
          output-file: ${{ env.GRYPE_ALL }}
          severity-cutoff: negligible
          only-fixed: false
          fail-build: false
          cache-db: true
          grype-version: v0.118.0

      - name: Gate on fixes installable from UBI repositories
        if: ${{ !cancelled() }}
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: python3 scripts/vulnerability-gate.py "${TRIVY_ALL}" "${GRYPE_ALL}"

      - name: Retain security artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-security-${{ github.ref_name }}-${{ matrix.architecture }}
          path: |
            ${{ env.TRIVY_ALL }}
            evidence/
            ${{ env.SBOM_FILE }}
            ${{ env.GRYPE_SARIF }}
            ${{ env.GRYPE_ALL }}
          if-no-files-found: warn
          retention-days: 30

      - name: Publish Grype findings to code scanning
        if: ${{ always() && github.event_name != 'pull_request' && hashFiles(env.GRYPE_SARIF) != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ env.GRYPE_SARIF }}
          category: grype-release-image-${{ matrix.architecture }}

  release:
    needs: [build, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download admitted release SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-security-${{ github.ref_name }}-amd64
          path: release-evidence

      - name: Prepare complete SPDX attestation
        run: cp release-evidence/clickhouse-ubi-amd64.spdx.json image.spdx.json

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Attest complete SPDX SBOM with GitHub OIDC
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: >-
          cosign attest --yes --predicate image.spdx.json --type spdxjson
          "${IMAGE}@${DIGEST}"

      - name: Sign image with GitHub OIDC
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: cosign sign --yes --bundle image.sigstore.json "${IMAGE}@${DIGEST}"

      - name: Download image attestations
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: cosign download attestation "${IMAGE}@${DIGEST}" > image.intoto.jsonl

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" --verify-tag
          --title "${GITHUB_REF_NAME}" --generate-notes
          image.spdx.json image.sigstore.json image.intoto.jsonl
